name: eightx-hack-local

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eightx
      # Public development-only credentials; never use these in a hosted database.
      POSTGRES_PASSWORD: eightx_local_dev
      POSTGRES_DB: eightx
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/000_roles.sql:/docker-entrypoint-initdb.d/000_roles.sql:ro
      - ./supabase/migrations/202610010001_foundations.sql:/docker-entrypoint-initdb.d/001_foundations.sql:ro
      - ./supabase/migrations/202610010002_evidence.sql:/docker-entrypoint-initdb.d/002_evidence.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U eightx -d eightx"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
